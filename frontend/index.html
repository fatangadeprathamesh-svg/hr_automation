<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Month-End HR Self-Audit Assistant</title>
    <!-- Brand Ice Blue Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23171B24'/><circle cx='12' cy='12' r='6' fill='%235B9BF3'/></svg>"
    />
    <!-- Tailwind CSS CDN for instant styling mapped to CSS theme tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              palette: {
                bg: 'var(--bg)',
                surface: 'var(--surface)',
                'surface-2': 'var(--surface-2)',
                border: 'var(--border)',
                text: 'var(--text)',
                muted: 'var(--text-muted)',
                accent: 'var(--accent)',
                'accent-ink': 'var(--accent-ink)',
                'accent-text': 'var(--accent-text)',
                'accent-hover': 'var(--accent-hover)',
              },
              status: {
                error: 'var(--status-error)',
                'error-bg': 'var(--status-error-bg)',
                'error-border': 'var(--status-error-border)',
                warning: 'var(--status-warning)',
                'warning-bg': 'var(--status-warning-bg)',
                'warning-border': 'var(--status-warning-border)',
                success: 'var(--status-success)',
                'success-bg': 'var(--status-success-bg)',
                'success-border': 'var(--status-success-border)',
                info: 'var(--status-info)',
                'info-bg': 'var(--status-info-bg)',
                'info-border': 'var(--status-info-border)',
              }
            }
          }
        }
      }
    </script>
    <script>
      // Early theme detection to prevent flash of wrong theme (DARK THEME IS DEFAULT)
      try {
        var saved = localStorage.getItem('hr_theme') || sessionStorage.getItem('hr_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
