<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Month-End HR Self-Audit Assistant</title>
    <!-- Google Identity Services (GIS) Client Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Tailwind CSS CDN for reliable instant dev styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                500: '#0284c7',
                600: '#0369a1',
                700: '#075985',
                900: '#0c4a6e',
              }
            }
          }
        }
      }
    </script>
    <script>
      // Early theme detection to prevent flash of wrong theme
      try {
        var saved = localStorage.getItem('hr_theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
